<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QwerZing AI Studio</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Inter, Arial, sans-serif;
    background: #f7f7fb;
    color: #202124;
}

button {
    font: inherit;
    cursor: pointer;
}

.app {
    min-height: 100vh;
    display: flex;
}

/* SIDEBAR */

.sidebar {
    width: 250px;
    min-height: 100vh;
    background: #ffffff;
    border-right: 1px solid #e7e7ed;
    padding: 24px 16px;
    position: fixed;
    left: 0;
    top: 0;
}

.logo {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 35px;
}

.logo span {
    color: #7657ff;
}

.nav {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.nav button {
    border: 0;
    background: transparent;
    padding: 13px 14px;
    border-radius: 12px;
    text-align: left;
    color: #60616b;
    transition: .2s;
}

.nav button:hover {
    background: #f2f0ff;
    color: #7657ff;
}

.nav button.active {
    background: #ece8ff;
    color: #7657ff;
    font-weight: 700;
}

/* MAIN */

.main {
    margin-left: 250px;
    width: calc(100% - 250px);
    min-height: 100vh;
    padding: 38px 48px;
}

/* TOP */

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 35px;
}

.page-title {
    font-size: 32px;
    font-weight: 800;
}

.page-subtitle {
    color: #777984;
    margin-top: 7px;
}

.primary-btn {
    border: 0;
    background: #7657ff;
    color: white;
    padding: 12px 18px;
    border-radius: 12px;
    font-weight: 700;
    transition: .2s;
}

.primary-btn:hover {
    background: #6344ec;
    transform: translateY(-1px);
}

/* BOOK */

.book-card {
    background: white;
    border: 1px solid #e6e6ec;
    border-radius: 18px;
    padding: 22px;
    max-width: 700px;
    cursor: pointer;
    transition: .2s;
}

.book-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(0,0,0,.06);
}

.book-title {
    font-size: 21px;
    font-weight: 750;
}

.book-info {
    color: #777984;
    margin-top: 8px;
}

/* BOOK NAVIGATION */

.book-header {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
}

.back-btn {
    border: 0;
    background: #ffffff;
    border: 1px solid #e5e5eb;
    border-radius: 10px;
    padding: 9px 13px;
}

.book-navigation {
    display: flex;
    gap: 8px;
    margin-bottom: 30px;
    flex-wrap: wrap;
}

.book-navigation button {
    border: 0;
    background: #ffffff;
    border: 1px solid #e5e5eb;
    padding: 10px 15px;
    border-radius: 10px;
    color: #666873;
}

.book-navigation button.active {
    background: #ece8ff;
    color: #7657ff;
    border-color: #d9d0ff;
    font-weight: 700;
}

/* CHARACTERS */

.characters-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
}

.character-card {
    background: #ffffff;
    border: 1px solid #e5e5eb;
    border-radius: 18px;
    padding: 20px;
    transition: .2s;
    cursor: pointer;
}

.character-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(0,0,0,.06);
}

.character-avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ece8ff, #ddd7ff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 800;
    color: #7657ff;
    margin-bottom: 16px;
}

.character-name {
    font-size: 20px;
    font-weight: 750;
}

.character-role {
    color: #7657ff;
    font-size: 14px;
    margin-top: 5px;
}

.character-description {
    color: #777984;
    line-height: 1.5;
    margin-top: 12px;
}

/* CHARACTER PAGE */

.character-page {
    max-width: 900px;
}

.character-profile {
    background: white;
    border: 1px solid #e5e5eb;
    border-radius: 20px;
    padding: 30px;
}

.profile-top {
    display: flex;
    gap: 22px;
    align-items: center;
    margin-bottom: 30px;
}

.profile-avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ece8ff, #dcd5ff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    font-weight: 800;
    color: #7657ff;
}

.profile-name {
    font-size: 30px;
    font-weight: 800;
}

.profile-role {
    color: #7657ff;
    margin-top: 5px;
}

.section {
    margin-top: 28px;
}

.section h3 {
    margin-bottom: 10px;
}

.section p {
    color: #60616b;
    line-height: 1.65;
}

.relationships {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.relationship {
    background: #f3f1ff;
    color: #7657ff;
    padding: 8px 12px;
    border-radius: 9px;
    font-size: 14px;
}

/* EMPTY */

.empty {
    background: white;
    border: 1px dashed #d8d8df;
    border-radius: 18px;
    padding: 50px;
    text-align: center;
    color: #777984;
}

/* RESPONSIVE */

@media (max-width: 800px) {

    .sidebar {
        width: 210px;
    }

    .main {
        margin-left: 210px;
        width: calc(100% - 210px);
        padding: 25px;
    }
}

@media (max-width: 600px) {

    .sidebar {
        position: relative;
        width: 100%;
        min-height: auto;
        border-right: 0;
        border-bottom: 1px solid #e7e7ed;
    }

    .app {
        display: block;
    }

    .main {
        margin-left: 0;
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            QwerZing <span>AI Studio</span>
        </div>

        <nav class="nav">

            <button id="nav-home" onclick="goHome()">
                Главная
            </button>

            <button id="nav-writer" onclick="openWriter()">
                Писатель
            </button>

        </nav>

    </aside>


    <main class="main" id="app"></main>

</div>


<script>

/* =========================================================
   ДАННЫЕ
========================================================= */

const characters = [
    {
        id: "rachel-hall",
        name: "Рейчел Холл",
        role: "Главная героиня",
        age: "18 лет",
        description:
            "Яркая, энергичная и независимая девушка с сильным характером.",
        appearance:
            "Каштаново-коричневые волосы, ярко-зелёные глаза, слегка загорелая кожа, стройное телосложение.",
        personality:
            "Весёлая, эмоциональная, уверенная в себе и умеющая постоять за себя. За внешней лёгкостью скрывает гораздо больше переживаний, чем показывает окружающим.",
        biography:
            "Дочь влиятельной семьи Холл. Поступает в Национальный университет вместе со своей близняшкой Клэр.",
        relationships: [
            "Джейсон Райт",
            "Клэр Холл",
            "Рейнольд Холл"
        ]
    },

    {
        id: "jason-wright",
        name: "Джейсон Райт",
        role: "Главный герой",
        age: "21 год",
        description:
            "Уверенный в себе, харизматичный и привыкший получать внимание.",
        appearance:
            "Высокий, спортивный, привлекательный мужчина с выразительной внешностью.",
        personality:
            "Самоуверенный, остроумный, раскованный и привыкший к лёгким отношениям. Однако за привычной уверенностью постепенно проявляется более глубокая сторона его характера.",
        biography:
            "Близкий друг Рейнольда Холла. Хорошо знаком с семьёй Холл и давно знает Рейчел.",
        relationships: [
            "Рейчел Холл",
            "Рейнольд Холл"
        ]
    }
];


/* =========================================================
   СОХРАНЕНИЕ СОСТОЯНИЯ
========================================================= */

const STORAGE_KEY = "qwerzing_ai_studio_navigation";

const defaultState = {
    page: "home",
    book: null,
    section: null,
    character: null
};


function saveState() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(currentState)
    );

}


function loadState() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (!saved) {
            return { ...defaultState };
        }

        return {
            ...defaultState,
            ...JSON.parse(saved)
        };

    } catch (error) {

        console.error(
            "Не удалось восстановить состояние:",
            error
        );

        return { ...defaultState };

    }

}


let currentState = loadState();


/* =========================================================
   НАВИГАЦИЯ
========================================================= */

function updateNavigation() {

    document
        .querySelectorAll(".nav button")
        .forEach(button => {
            button.classList.remove("active");
        });

    if (
        currentState.page === "writer" ||
        currentState.page === "book"
    ) {

        document
            .getElementById("nav-writer")
            .classList.add("active");

    }

    if (currentState.page === "home") {

        document
            .getElementById("nav-home")
            .classList.add("active");

    }

}


/* =========================================================
   ГЛАВНАЯ
========================================================= */

function goHome() {

    currentState = {
        page: "home",
        book: null,
        section: null,
        character: null
    };

    saveState();
    render();

}


/* =========================================================
   ПИСАТЕЛЬ
========================================================= */

function openWriter() {

    currentState = {
        page: "writer",
        book: null,
        section: null,
        character: null
    };

    saveState();
    render();

}


/* =========================================================
   ОТКРЫТИЕ КНИГИ
========================================================= */

function openBook() {

    currentState = {
        page: "book",
        book: "my-book",
        section: "about",
        character: null
    };

    saveState();
    render();

}


/* =========================================================
   РАЗДЕЛ КНИГИ
========================================================= */

function openSection(section) {

    currentState.page = "book";
    currentState.section = section;
    currentState.character = null;

    saveState();
    render();

}


/* =========================================================
   ПЕРСОНАЖ
========================================================= */

function openCharacter(id) {

    currentState.page = "book";
    currentState.book = "my-book";
    currentState.section = "characters";
    currentState.character = id;

    saveState();
    render();

}


/* =========================================================
   РЕНДЕР
========================================================= */

function render() {

    const app =
        document.getElementById("app");

    if (currentState.page === "home") {

        renderHome(app);

    } else if (currentState.page === "writer") {

        renderWriter(app);

    } else if (currentState.page === "book") {

        renderBook(app);

    }

    updateNavigation();

}


/* =========================================================
   HOME
========================================================= */

function renderHome(app) {

    app.innerHTML = `

        <div class="topbar">

            <div>
                <div class="page-title">
                    Добро пожаловать
                </div>

                <div class="page-subtitle">
                    Твоя творческая студия для создания историй
                </div>
            </div>

        </div>

        <div class="book-card"
             onclick="openWriter()">

            <div class="book-title">
                Писатель
            </div>

            <div class="book-info">
                Создавай книги, персонажей, миры и главы
                в одном пространстве.
            </div>

        </div>

    `;

}


/* =========================================================
   WRITER
========================================================= */

function renderWriter(app) {

    app.innerHTML = `

        <div class="topbar">

            <div>

                <div class="page-title">
                    Писатель
                </div>

                <div class="page-subtitle">
                    Твои книги и творческие проекты
                </div>

            </div>

            <button class="primary-btn">
                + Новая книга
            </button>

        </div>


        <div class="book-card"
             onclick="openBook()">

            <div class="book-title">
                Моя первая книга
            </div>

            <div class="book-info">
                Роман · Последнее изменение сегодня
            </div>

        </div>

    `;

}


/* =========================================================
   BOOK
========================================================= */

function renderBook(app) {

    if (currentState.character) {

        renderCharacter(app);
        return;

    }


    const sections = [
        ["about", "О книге"],
        ["characters", "Персонажи"],
        ["world", "Мир"],
        ["plot", "План"],
        ["chapters", "Главы"],
        ["ai", "AI-помощник"]
    ];


    let content = "";


    if (currentState.section === "characters") {

        content = renderCharacters();

    } else if (currentState.section === "world") {

        content = `
            <div class="empty">
                Раздел «Мир» будет добавлен следующим.
            </div>
        `;

    } else if (currentState.section === "plot") {

        content = `
            <div class="empty">
                Здесь будет план книги.
            </div>
        `;

    } else if (currentState.section === "chapters") {

        content = `
            <div class="empty">
                Здесь будут главы книги.
            </div>
        `;

    } else if (currentState.section === "ai") {

        content = `
            <div class="empty">
                Здесь будет AI-помощник автора.
            </div>
        `;

    } else {

        content = `
            <div class="empty">
                Информация о книге.
            </div>
        `;

    }


    app.innerHTML = `

        <div class="book-header">

            <button class="back-btn"
                    onclick="openWriter()">
                ← К книгам
            </button>

            <div>

                <div class="page-title"
                     style="font-size:25px;">
                    Моя первая книга
                </div>

                <div class="page-subtitle">
                    Рабочее пространство книги
                </div>

            </div>

        </div>


        <div class="book-navigation">

            ${sections.map(section => `

                <button
                    class="${
                        currentState.section === section[0]
                        ? "active"
                        : ""
                    }"
                    onclick="openSection('${section[0]}')">

                    ${section[1]}

                </button>

            `).join("")}

        </div>


        ${content}

    `;

}


/* =========================================================
   CHARACTERS
========================================================= */

function renderCharacters() {

    return `

        <div class="topbar">

            <div>

                <div class="page-title">
                    Персонажи
                </div>

                <div class="page-subtitle">
                    Герои и персонажи твоей истории
                </div>

            </div>

            <button class="primary-btn">
                + Создать персонажа
            </button>

        </div>


        <div class="characters-grid">

            ${characters.map(character => `

                <div class="character-card"
                     onclick="openCharacter('${character.id}')">

                    <div class="character-avatar">
                        ${character.name.charAt(0)}
                    </div>

                    <div class="character-name">
                        ${character.name}
                    </div>

                    <div class="character-role">
                        ${character.role}
                    </div>

                    <div class="character-description">
                        ${character.description}
                    </div>

                </div>

            `).join("")}

        </div>

    `;

}


/* =========================================================
   CHARACTER PROFILE
========================================================= */

function renderCharacter(app) {

    const character =
        characters.find(
            item => item.id === currentState.character
        );


    if (!character) {

        currentState.character = null;
        saveState();

        render();
        return;

    }


    app.innerHTML = `

        <div class="book-header">

            <button class="back-btn"
                    onclick="openSection('characters')">
                ← Персонажи
            </button>

            <div>

                <div class="page-title"
                     style="font-size:25px;">
                    ${character.name}
                </div>

                <div class="page-subtitle">
                    Карточка персонажа
                </div>

            </div>

        </div>


        <div class="character-page">

            <div class="character-profile">

                <div class="profile-top">

                    <div class="profile-avatar">
                        ${character.name.charAt(0)}
                    </div>

                    <div>

                        <div class="profile-name">
                            ${character.name}
                        </div>

                        <div class="profile-role">
                            ${character.role}
                        </div>

                        <div class="book-info">
                            ${character.age}
                        </div>

                    </div>

                </div>


                <div class="section">

                    <h3>
                        Внешность
                    </h3>

                    <p>
                        ${character.appearance}
                    </p>

                </div>


                <div class="section">

                    <h3>
                        Характер
                    </h3>

                    <p>
                        ${character.personality}
                    </p>

                </div>


                <div class="section">

                    <h3>
                        Биография
                    </h3>

                    <p>
                        ${character.biography}
                    </p>

                </div>


                <div class="section">

                    <h3>
                        Отношения
                    </h3>

                    <div class="relationships">

                        ${character.relationships
                            .map(
                                relation => `
                                    <div class="relationship">
                                        ${relation}
                                    </div>
                                `
                            )
                            .join("")}

                    </div>

                </div>

            </div>

        </div>

    `;

}


/* =========================================================
   ВОССТАНОВЛЕНИЕ ПОСЛЕ F5
========================================================= */

window.addEventListener(
    "DOMContentLoaded",
    () => {

        render();

    }
);


/* =========================================================
   ДОПОЛНИТЕЛЬНАЯ ЗАЩИТА
   Если пользователь обновил страницу,
   состояние уже находится в localStorage.
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        saveState();

    }
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QwerZing AI Studio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f3ff;
            color: #292235;
        }

        header {
            padding: 25px 20px;
            background: #ffffff;
            border-bottom: 1px solid #e8def5;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #7b4dcc;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        .welcome {
            background: #ffffff;
            border-radius: 25px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(100, 70, 150, 0.08);
        }

        h1 {
            margin-top: 0;
            font-size: 36px;
        }

        .subtitle {
            font-size: 18px;
            color: #766d80;
            line-height: 1.6;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 35px;
        }

        button {
            border: none;
            border-radius: 16px;
            padding: 20px;
            font-size: 16px;
            font-weight: bold;
            background: #f0e8ff;
            color: #6540a8;
            cursor: pointer;
        }

        button:hover {
            background: #e5d8ff;
        }

        .main-button {
            background: #7b4dcc;
            color: white;
        }

        .main-button:hover {
            background: #693bb5;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 28px;
            }

            .buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">QwerZing AI Studio</div>
    </header>

    <main class="container">
        <section class="welcome">
            <h1>Добро пожаловать в QwerZing</h1>

            <p class="subtitle">
                Твоя творческая AI-студия для общения, письма,
                создания изображений и работы над проектами.
            </p>

            <div class="buttons">
                <button class="main-button">💬 Чат</button>
                <button>🤖 AI Друг</button>
                <button>✍️ Писатель</button>
                <button>🎨 Художник</button>
                <button>📁 Проекты</button>
                <button>🧠 Память</button>
            </div>
        </section>
    </main>

</body>
</html>
